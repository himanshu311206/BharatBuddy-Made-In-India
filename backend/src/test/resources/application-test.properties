spring.datasource.url=jdbc:h2:mem:bharatbuddy;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-for-bharat-buddy
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173

# Tests must not send real emails — EmailService is mocked in test config
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@bharatbuddy.com
spring.mail.password=dummy
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
